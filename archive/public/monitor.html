<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeMans Call Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link href="/transcript-view.css" rel="stylesheet" />
  <style>
    :root {
      --red: #e11d48;
      --bg: #0a0a0a;
      --card: rgba(20, 20, 20, 0.9);
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #71717a;
      --green: #22c55e;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
    }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logo { font-size: 1.2rem; font-weight: 700; }
    .logo span { color: var(--red); }
    .conn { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .conn.on .dot { background: var(--green); }

    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px 1fr; gap: 14px; }
    .calls, .view {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-height: 0;
    }
    .calls { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .calls-empty { color: var(--muted); font-size: 0.85rem; padding: 12px; }
    .call {
      text-align: left;
      background: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .call:hover { background: rgba(255,255,255,0.04); }
    .call.sel { background: rgba(225,29,72,0.10); border-color: rgba(225,29,72,0.3); }
    .call-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; font-weight: 600; }
    .call-sub { font-size: 0.72rem; color: var(--muted); }
    .live { color: var(--green); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; }
    .ended { color: var(--muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; }

    .view { display: flex; flex-direction: column; padding: 14px; gap: 10px; }
    .view-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
    .view-head button {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .view-head button:disabled { opacity: 0.4; cursor: default; }
    .view-head label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #transcript { flex: 1; min-height: 0; }

    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .calls { max-height: 180px; }
      #transcript { min-height: 360px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Le<span>Mans</span> Call Monitor</div>
    <div class="conn" id="conn"><span class="dot"></span><span id="connText">Connecting…</span></div>
  </header>

  <main>
    <div class="calls" id="calls"><div class="calls-empty">No calls yet. Start a web demo or ring the phone line.</div></div>
    <section class="view">
      <div class="view-head">
        <span id="callTitle">Select a call</span>
        <span style="display:flex;gap:12px;align-items:center">
          <label><input type="checkbox" id="follow" checked /> Follow newest call</label>
          <button type="button" id="downloadBtn" disabled>Download</button>
        </span>
      </div>
      <div class="tv-log" id="transcript" data-empty="Transcript will stream here live"></div>
    </section>
  </main>

<script src="/socket.io/socket.io.js"></script>
<script src="/transcript-view.js"></script>
<script>
  const socket      = io('/monitor');
  const callsEl     = document.getElementById('calls');
  const callTitle   = document.getElementById('callTitle');
  const followEl    = document.getElementById('follow');
  const downloadBtn = document.getElementById('downloadBtn');
  const conn        = document.getElementById('conn');
  const connText    = document.getElementById('connText');
  const view        = new TranscriptView(document.getElementById('transcript'));

  // callId -> { callId, source, callerNumber, startedAt, endedAt, lines: [] }
  const calls = new Map();
  let selected = null;

  socket.on('connect',    () => { conn.classList.add('on');    connText.textContent = 'Live'; });
  socket.on('disconnect', () => { conn.classList.remove('on'); connText.textContent = 'Disconnected — reconnecting…'; });

  socket.on('snapshot', ({ calls: list }) => {
    calls.clear();
    for (const c of list) calls.set(c.callId, c);
    const newest = [...calls.values()].sort((a, b) => b.startedAt - a.startedAt)[0];
    renderCalls();
    if (selected && calls.has(selected)) select(selected);
    else if (newest) select(newest.callId);
  });

  socket.on('call-started', (c) => {
    calls.set(c.callId, { ...c, lines: [] });
    renderCalls();
    if (followEl.checked || !selected) select(c.callId);
  });

  socket.on('call-ended', ({ callId, endedAt }) => {
    const c = calls.get(callId);
    if (!c) return;
    c.endedAt = endedAt;
    renderCalls();
    if (callId === selected) { view.finalizeAll(); updateTitle(); }
  });

  socket.on('transcript', (e) => {
    const c = calls.get(e.callId);
    if (!c) return;
    applyToStore(c, e);
    if (e.callId === selected) view.apply(e);
  });

  // Same reducer as the server, so switching calls rebuilds the exact text.
  function applyToStore(c, e) {
    let l = c.lines.find((x) => x.id === e.id && x.role === e.role);
    if (!l) {
      l = { id: e.id, role: e.role, text: '', final: false, interrupted: false, ts: e.ts };
      c.lines.push(l);
    }
    if (e.kind === 'delta') l.text += e.text || '';
    else if (e.kind === 'final') { l.text = e.text ?? l.text; l.final = true; }
    else if (e.kind === 'interrupted') l.interrupted = true;
    else if (e.kind === 'speaker') l.speaker = e.speaker || null;
  }

  function select(callId) {
    const c = calls.get(callId);
    if (!c) return;
    selected = callId;
    view.load(c.lines, c.startedAt);
    if (c.endedAt) view.finalizeAll();
    downloadBtn.disabled = false;
    updateTitle();
    renderCalls();
  }

  function updateTitle() {
    const c = calls.get(selected);
    if (!c) return;
    const kind = c.source === 'phone' ? 'Phone' : 'Web demo';
    const who = c.source === 'phone' ? c.callerNumber : c.callId.slice(0, 6);
    callTitle.textContent = `${kind} · ${who} · started ${new Date(c.startedAt).toLocaleTimeString()}` +
      (c.endedAt ? ' · ended' : ' · live');
  }

  function renderCalls() {
    const list = [...calls.values()].sort((a, b) => b.startedAt - a.startedAt);
    callsEl.textContent = '';
    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'calls-empty';
      empty.textContent = 'No calls yet. Start a web demo or ring the phone line.';
      callsEl.appendChild(empty);
      return;
    }
    for (const c of list) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'call' + (c.callId === selected ? ' sel' : '');
      const top = document.createElement('div');
      top.className = 'call-top';
      const name = document.createElement('span');
      name.textContent = c.source === 'phone' ? `📞 ${c.callerNumber}` : `🌐 Web ${c.callId.slice(0, 6)}`;
      const state = document.createElement('span');
      state.className = c.endedAt ? 'ended' : 'live';
      state.textContent = c.endedAt ? 'ended' : '● live';
      top.append(name, state);
      const sub = document.createElement('div');
      sub.className = 'call-sub';
      sub.textContent = new Date(c.startedAt).toLocaleTimeString();
      b.append(top, sub);
      b.onclick = () => select(c.callId);
      callsEl.appendChild(b);
    }
  }

  downloadBtn.onclick = () => {
    const c = calls.get(selected);
    if (!c) return;
    const stamp = new Date(c.startedAt).toISOString().slice(0, 19).replace(/[:T]/g, '-');
    downloadText(`lemans-${c.source}-${stamp}.txt`, view.toPlainText());
  };
</script>
</body>
</html>
