<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeMans Entertainment — AI Receptionist Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #e11d48;
      --red-dark: #be123c;
      --bg: #0a0a0a;
      --card: rgba(20, 20, 20, 0.9);
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #71717a;
      --green: #22c55e;
      --yellow: #eab308;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(at 20% 10%, rgba(225,29,72,0.12) 0, transparent 55%),
        radial-gradient(at 80% 90%, rgba(225,29,72,0.08) 0, transparent 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--red); }
    .tagline { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      backdrop-filter: blur(16px);
      box-shadow: 0 32px 64px -16px rgba(0,0,0,0.6);
    }

    /* Orb */
    .orb-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }
    .orb {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 24px rgba(225,29,72,0.35);
      transition: all 0.4s ease;
    }
    .orb::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--red);
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    .orb.listening { background: var(--green); box-shadow: 0 0 28px rgba(34,197,94,0.45); }
    .orb.listening::after { border-color: var(--green); }
    .orb.speaking { background: var(--yellow); box-shadow: 0 0 28px rgba(234,179,8,0.45); }
    .orb.speaking::after { border-color: var(--yellow); animation-duration: 1s; }
    .orb svg { width: 38px; height: 38px; fill: white; }

    /* Status */
    .status-row {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .badge {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      background: rgba(225,29,72,0.15);
      color: #fb7185;
      border: 1px solid rgba(225,29,72,0.25);
      transition: all 0.3s;
    }
    .badge.connected {
      background: rgba(34,197,94,0.12);
      color: var(--green);
      border-color: rgba(34,197,94,0.25);
    }
    .badge.speaking-badge {
      background: rgba(234,179,8,0.12);
      color: var(--yellow);
      border-color: rgba(234,179,8,0.25);
    }

    /* Buttons */
    .controls { display: flex; flex-direction: column; gap: 12px; }
    button {
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.1px;
    }
    .btn-start {
      background: var(--red);
      color: white;
    }
    .btn-start:hover { background: var(--red-dark); transform: translateY(-1px); }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-end {
      background: rgba(255,255,255,0.07);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-end:hover { background: rgba(255,255,255,0.12); }

    /* Transcript panels */
    .panels { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
    .panel-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .panel {
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--muted);
      min-height: 44px;
      border: 1px solid var(--border);
    }
    .panel.agent { border-left: 3px solid var(--red); }
    .panel.user  { border-left: 3px solid #818cf8; }
    .panel .active { color: var(--text); }

    /* Lead / Transfer notification */
    .notification {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
      display: none;
    }
    .notification.lead {
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.25);
      color: var(--green);
    }
    .notification.transfer {
      background: rgba(234,179,8,0.08);
      border: 1px solid rgba(234,179,8,0.25);
      color: var(--yellow);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">Le<span>Mans</span> Entertainment</div>
  <div class="tagline">AI Receptionist — POC Demo</div>
</div>

<div class="card">
  <div class="orb-wrap">
    <div class="orb" id="orb">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </div>
  </div>

  <div class="status-row">
    <div class="badge" id="badge">Ready to connect</div>
  </div>

  <div class="controls">
    <button class="btn-start" id="startBtn">Start Demo Call</button>
    <button class="btn-end hidden" id="endBtn">End Call</button>
  </div>

  <div class="panels" id="panels" style="display:none">
    <div>
      <div class="panel-label">Alex (AI Receptionist)</div>
      <div class="panel agent" id="agentPanel">Waiting...</div>
    </div>
    <div>
      <div class="panel-label">You</div>
      <div class="panel user" id="userPanel">...</div>
    </div>
  </div>

  <div class="notification lead" id="leadNotif"></div>
  <div class="notification transfer" id="transferNotif"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const orb        = document.getElementById('orb');
  const badge      = document.getElementById('badge');
  const startBtn   = document.getElementById('startBtn');
  const endBtn     = document.getElementById('endBtn');
  const panels     = document.getElementById('panels');
  const agentPanel = document.getElementById('agentPanel');
  const userPanel  = document.getElementById('userPanel');
  const leadNotif  = document.getElementById('leadNotif');
  const transferNotif = document.getElementById('transferNotif');

  // ─── Audio ───────────────────────────────────────────────────────────────────
  let audioCtx = null;
  let mediaStream = null;
  let workletNode = null;
  let isActive = false;

  let playQueue = [];
  let playing = false;
  const CAPTURE_SR  = 24000;
  const PLAYBACK_SR = 16000;

  function orbState(state) {
    orb.classList.remove('listening', 'speaking');
    if (state) orb.classList.add(state);
  }

  function setStatus(text, type = '') {
    badge.textContent = text;
    badge.className = 'badge' + (type ? ` ${type}` : '');
  }

  function enqueueAudio(b64) {
    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const pcm16 = new Int16Array(bytes.buffer);
    const f32 = new Float32Array(pcm16.length);
    for (let i = 0; i < pcm16.length; i++) f32[i] = pcm16[i] / 32768;
    playQueue.push(f32);
    if (!playing) playNext();
  }

  function playNext() {
    if (!playQueue.length || !audioCtx) { playing = false; orbState('listening'); setStatus('Listening...', 'connected'); return; }
    playing = true;
    orbState('speaking');
    setStatus('Alex is speaking...', 'speaking-badge');
    const samples = playQueue.shift();
    const buf = audioCtx.createBuffer(1, samples.length, PLAYBACK_SR);
    buf.copyToChannel(samples, 0);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.onended = playNext;
    src.start();
  }

  function stopPlayback() {
    playQueue = [];
    playing = false;
  }

  async function startMic() {
    audioCtx = new AudioContext({ sampleRate: CAPTURE_SR });
    const code = `
      class PCMProcessor extends AudioWorkletProcessor {
        process(inputs) {
          const ch = inputs[0]?.[0];
          if (ch) {
            const pcm = new Int16Array(ch.length);
            for (let i = 0; i < ch.length; i++) {
              const s = Math.max(-1, Math.min(1, ch[i]));
              pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            this.port.postMessage(pcm.buffer, [pcm.buffer]);
          }
          return true;
        }
      }
      registerProcessor('pcm-proc', PCMProcessor);
    `;
    const blob = new Blob([code], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);

    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: CAPTURE_SR, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    const src = audioCtx.createMediaStreamSource(mediaStream);
    workletNode = new AudioWorkletNode(audioCtx, 'pcm-proc');
    workletNode.port.onmessage = (e) => {
      if (!isActive) return;
      const bytes = new Uint8Array(e.data);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      socket.emit('audio-chunk', { audio: btoa(bin) });
    };
    src.connect(workletNode);
    workletNode.connect(audioCtx.destination);
  }

  function stopMic() {
    workletNode?.disconnect(); workletNode = null;
    mediaStream?.getTracks().forEach(t => t.stop()); mediaStream = null;
    audioCtx?.close(); audioCtx = null;
  }

  // ─── Socket events ───────────────────────────────────────────────────────────
  socket.on('session-started', () => {
    setStatus('Connected — Listening...', 'connected');
    orbState('listening');
    panels.style.display = 'flex';
  });

  socket.on('audio-delta', (d) => enqueueAudio(d.delta));

  let agentText = '';
  socket.on('transcript-delta', (d) => {
    agentText += d.delta;
    agentPanel.innerHTML = `<span class="active">${agentText}</span>`;
  });
  socket.on('transcript-done', () => { agentText = ''; });

  socket.on('user-transcript', (d) => {
    userPanel.innerHTML = `<span class="active">${d.transcript}</span>`;
  });

  socket.on('speech-started', () => {
    stopPlayback();
    orbState('listening');
    setStatus('Listening...', 'connected');
    agentText = '';
  });

  socket.on('lead-saved', (d) => {
    leadNotif.style.display = 'block';
    leadNotif.innerHTML = `✅ Lead saved — <strong>${d.caller_name}</strong> | ${d.event_type} | Synced to ActiveCampaign`;
  });

  socket.on('transfer-initiated', (d) => {
    transferNotif.style.display = 'block';
    transferNotif.innerHTML = `📞 Transferring <strong>${d.event_type}</strong> call → ${d.transfer_to}`;
  });

  socket.on('realtime-error', (d) => {
    setStatus('Error: ' + (d.error?.message ?? 'Unknown'));
  });

  socket.on('session-closed', () => endSession());

  // ─── Buttons ─────────────────────────────────────────────────────────────────
  startBtn.onclick = async () => {
    try {
      startBtn.disabled = true;
      setStatus('Connecting...');
      await startMic();
      isActive = true;
      socket.emit('start-session');
      startBtn.classList.add('hidden');
      endBtn.classList.remove('hidden');
    } catch (err) {
      console.error(err);
      setStatus('Mic access denied');
      startBtn.disabled = false;
    }
  };

  endBtn.onclick = () => {
    socket.emit('end-session');
    endSession();
  };

  function endSession() {
    isActive = false;
    stopPlayback();
    stopMic();
    startBtn.classList.remove('hidden');
    startBtn.disabled = false;
    endBtn.classList.add('hidden');
    orbState(null);
    setStatus('Call ended');
  }
</script>
</body>
</html>
